name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning install.sh tests/run.sh

  e2e:
    needs: shellcheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie", "debian:bookworm", "ubuntu:24.04", "almalinux:9"]
    steps:
      - uses: actions/checkout@v7
      - name: End-to-end tests on ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" bash /src/tests/run.sh
