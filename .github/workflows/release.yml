name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checksums
        run: sha256sum install.sh > SHA256SUMS && cat SHA256SUMS
      - name: Signed build provenance (verify with `gh attestation verify`)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: install.sh
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" install.sh SHA256SUMS --clobber
